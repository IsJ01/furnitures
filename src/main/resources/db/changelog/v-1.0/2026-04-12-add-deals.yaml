databaseChangeLog:
  - changeSet:
      id: 7_add_deals_table
      author: "Safi"
      changes:
        - createTable:
            tableName: "deals"
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: phone
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
        - createTable:
            tableName: "deals_furnitures"
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: deal_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: furniture_id
                  type: BIGINT
                  constraints:
                    nullable: false
  - changeSet:
      id: 8_add_business_rules
      author: "Safi"
      changes:
        - addForeignKeyConstraint:
            baseTableName: "deals_furnitures"
            baseColumnNames: "deal_id"
            referencedTableName: "deals"
            referencedColumnNames: "id"
            constraintName: "fk_deals_ref"
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: "deals_furnitures"
            baseColumnNames: "furniture_id"
            referencedTableName: "furnitures"
            referencedColumnNames: "id"
            constraintName: "fk_deals_content"
            onDelete: CASCADE
        - sql:
            sql: |
                ALTER TABLE deals ADD CONSTRAINT chk_deal_phone CHECK (TRIM(phone) <> '');
              