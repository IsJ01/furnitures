databaseChangeLog:
  - changeSet:
      id: 5_create_users_table
      author: "Safi"
      changes:
        - createTable:
            tableName: "users"
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: username
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
  - changeSet:
      id: 6_add_business_rules
      author: "Safi"
      changes:
        - sql:
            sql: |
              ALTER TABLE users ADD CONSTRAINT chk_user_role CHECK (role IN ('ADMIN', 'CONSULTANT'));
                    