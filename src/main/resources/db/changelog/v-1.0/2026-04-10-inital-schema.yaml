databaseChangeLog:
  - changeSet:
      id: 1_create_tables
      author: "Safi"
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: parent_id
                  type: BIGINT
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true     
        - createTable:
            tableName: furnitures
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: category_id
                  type: BIGINT
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: width
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: height
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: depth
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: material
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
  - changeSet:
      id: 2_add_business_rules
      author: "Safi"
      changes:
        - addForeignKeyConstraint:
            baseTableName: furnitures
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_furniture_categories
        - addForeignKeyConstraint:
            baseTableName: categories
            baseColumnNames: parent_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_parents_categories
        - sql:
            sql: |
              ALTER TABLE categories ADD CONSTRAINT chk_category_name CHECK (TRIM(name) <> '');
        - sql:
            sql: |
              ALTER TABLE furnitures ADD CONSTRAINT chk_furniture_name CHECK (TRIM(name) <> '');
              ALTER TABLE furnitures ADD CONSTRAINT chk_furniture_material CHECK (TRIM(material) <> '');
  - changeSet:
      id: 3_insert_categories
      author: "Safi"
      changes:
        - sql:
            sql: |
              INSERT INTO categories (id, name, parent_id) VALUES
