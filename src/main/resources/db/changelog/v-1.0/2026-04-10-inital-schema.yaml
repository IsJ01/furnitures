databaseChangeLog:
  - changeSet:
      id: 1_create_tables
      author: "Safi"
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true     
        - createTable:
            tableName: furnitures
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: width
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: height
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: depth
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: material
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
  - changeSet:
      id: 2_add_business_rules
      author: "Safi"
      changes:
        - addForeignKeyConstraint:
            baseTableName: furnitures
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_furniture_categories
        - sql:
            sql: |
              ALTER TABLE categories ADD CONSTRAINT chk_category_name CHECK (TRIM(name) <> '');

