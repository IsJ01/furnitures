databaseChangeLog:
  - changeSet:
      id: 12_delete_tables
      author: "Safi"
      changes:
        - dropTable:
            tableName: "deals_furnitures"
            cascadeConstraints: true
        - addColumn:
            tableName: "deals"
            columns:
              - column:
                  name: furniture_id
                  type: BIGINT
                  constraints:
                    nullable: false
  - changeSet:
      id: 13_add_business_rules
      author: "Safi"
      changes:
        - addForeignKeyConstraint:
            baseTableName: "deals"
            baseColumnNames: "furniture_id"
            referencedTableName: "furnitures"
            referencedColumnNames: "id"
            constraintName: "fk_deal_furniture"
            onDelete: CASCADE
              