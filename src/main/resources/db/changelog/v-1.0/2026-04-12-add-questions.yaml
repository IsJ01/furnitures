databaseChangeLog:
  - changeSet:
      id: 9_add_tables
      author: "Safi"
      changes:
        - createTable:
            tableName: questions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: phone
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: text
                  type: VARCHAR(1024)
                  constraints:
                    nullable: false
        - createTable:
            tableName: answers
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: question_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: consultant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: text
                  type: VARCHAR(1024)
                  constraints:
                    nullable: false
  - changeSet:
      id: 10_add_business_rules
      author: "Safi"
      changes:
        - addForeignKeyConstraint:
            baseTableName: answers
            baseColumnNames: question_id
            referencedTableName: questions
            referencedColumnNames: id
            constraintName: fk_questions_answers
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: answers
            baseColumnNames: consultant_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_users_answers
            onDelete: CASCADE
        - sql:
            sql: |
                ALTER TABLE questions ADD CONSTRAINT chk_questions_phone CHECK (TRIM(phone) <> '');
